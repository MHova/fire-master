# Nginx config for the production frontend image (Dockerfile.prod).
# Serves the built SPA; API calls are relative /api and are routed by the
# reverse proxy in front (Caddy in the demo stack), never by nginx.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
