# Nginx config for the production frontend image (Dockerfile.prod).
# Serves the built SPA; API calls are relative /api and are routed by the
# reverse proxy in front (Caddy in the demo stack), never by nginx.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: any path that isn't a real file serves index.html.
    # NB: no `$uri/` clause — the app has real routes (e.g. /assets, the Asset
    # Hub) and a directory match would 403 instead of falling through to the SPA.
    location / {
        try_files $uri /index.html;
    }

    # Vite emits content-hashed bundles under /static/ (see vite.config.ts
    # assetsDir — renamed from the default "assets" to avoid shadowing the
    # /assets app route). Real files only; safe to cache forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
