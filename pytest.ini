# Safety net for running pytest from the repo root instead of backend/.
# Without a config file here, pytest's rootdir lands on the repo root,
# backend/pyproject.toml's [tool.pytest.ini_options] is never read, and
# asyncio_mode falls back to strict — every async test then fails with
# "async def functions are not natively supported". Keep in sync with
# backend/pyproject.toml.
[pytest]
testpaths = backend/tests
asyncio_mode = auto
